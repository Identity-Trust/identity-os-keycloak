services:

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.1}
    container_name: ${KEYCLOAK_CONTAINER_NAME:-identity-os-keycloak}

    command:
      - start-dev
      - --http-port=8080
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

    ports:
      - "${KEYCLOAK_PORT:-8085}:8080"

    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
